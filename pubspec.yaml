name: haki
description: A polished, animation-rich, local-first language flashcard application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Database & Persistence
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^18.1.2

  # File & CSV Processing
  csv: ^8.0.0
  file_picker: ^13.3.0

  # Typography
  google_fonts: ^9.0.0

  # Charts
  fl_chart: ^1.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  share_plus: ^13.3.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/haki_icon_1024x1024.png"
  adaptive_icon_background: "assets/icon/haki_icon_1024x1024.png" 
  adaptive_icon_foreground: "assets/icon/haki_icon_1024x1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/samples/
